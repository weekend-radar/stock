# Save as .github/workflows/update-prices.yml
name: Update SG prices

on:
  schedule:
    # Hourly, Mon-Fri, 01:15-09:15 UTC = 09:15-17:15 Singapore time (SGX hours)
    - cron: "15 1-9 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python fetch_prices.py
      - name: Commit data.json
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update prices"
          git push
